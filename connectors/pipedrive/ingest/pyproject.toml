[project]
name = "pipedrive-ingest"
version = "0.1.0"
description = "dlt pipelines that land Pipedrive data in the lake: API to raw JSONL, raw to bronze Iceberg."
requires-python = ">=3.11"
dependencies = [
    "dlt[gs,pyiceberg,s3]==1.31.0",
    "pyiceberg==0.12.0",
    "pyyaml>=6.0",
]

[project.scripts]
pipedrive-ingest = "pipedrive_ingest.pipeline:main"

[dependency-groups]
dev = [
    "duckdb==1.5.6",
    "mypy==1.19.1",
    "pytest==9.1.1",
    "requests-mock==1.12.1",
    "ruff==0.16.10",
    "types-pyyaml",
    "types-requests",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipedrive_ingest"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["pipedrive_ingest"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["fsspec", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Raised inside dlt's DuckDB client; not actionable here.
    "ignore:fetch_arrow_table\\(\\) is deprecated:DeprecationWarning",
]
