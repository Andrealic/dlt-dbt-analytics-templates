          - name: days_to_rotten
            data_type: bigint
          - name: is_deleted
            data_type: boolean
          - name: add_time
            data_type: timestamp with time zone
          - name: update_time
            data_type: timestamp with time zone
          - name: _load_id
            data_type: varchar
          - name: _raw_load_id
            data_type: varchar
          - name: _loaded_at
