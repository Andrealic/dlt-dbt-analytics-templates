          - name: _source_updated_at
            data_type: timestamp with time zone
          - name: _is_deleted
            data_type: boolean
      - name: users
        description: "Pipedrive users (deal and record owners). Full refresh, replaced on every load."
        columns:
          - name: id
            data_type: bigint
          - name: name
            data_type: varchar
          - name: email
            data_type: varchar
          - name: phone
            data_type: varchar
          - name: default_currency
            data_type: varchar
          - name: locale
            data_type: varchar
          - name: lang
            data_type: bigint
          - name: timezone_name
            data_type: varchar
          - name: timezone_offset
            data_type: varchar
          - name: role_id
            data_type: bigint
          - name: icon_url
            data_type: varchar
          - name: access
            data_type: varchar
          - name: activated
            data_type: boolean
          - name: active_flag
            data_type: boolean
          - name: has_created_company
            data_type: boolean
          - name: is_you
            data_type: boolean
          - name: is_deleted
            data_type: boolean
          - name: last_login
            data_type: timestamp with time zone
          - name: created
            data_type: timestamp with time zone
          - name: modified
            data_type: timestamp with time zone
          - name: _load_id
            data_type: varchar
          - name: _raw_load_id
            data_type: varchar
          - name: _loaded_at
