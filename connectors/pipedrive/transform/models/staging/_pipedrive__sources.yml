version: 2

sources:
  - name: pipedrive
    description: >
      Bronze Iceberg tables written by the Pipedrive ingest. One row per primary key,
      holding the latest version found in raw, so keys are unique by construction; they
      are tested in staging. A table exists once its entity has a first record. Declared
      in ingest/src/pipedrive_ingest/schemas/; metadata columns follow the lake contract.
    database: "{{ var('lake_catalog', 'lake') }}"
    schema: pipedrive
    loaded_at_field: _loaded_at
    tables:
      - name: deals
        description: "Deals, including deleted (flagged) and archived ones. Incremental, upserted on id."
        columns:
          - name: id
            data_type: bigint
          - name: title
            data_type: varchar
          - name: owner_id
            data_type: bigint
          - name: person_id
            data_type: bigint
          - name: org_id
            data_type: bigint
          - name: pipeline_id
            data_type: bigint
          - name: stage_id
            data_type: bigint
          - name: value
            data_type: double
          - name: currency
            data_type: varchar
          - name: status
            data_type: varchar
          - name: probability
            data_type: double
          - name: lost_reason
            data_type: varchar
          - name: visible_to
            data_type: bigint
          - name: label_ids
            data_type: varchar
          - name: is_deleted
            data_type: boolean
          - name: is_archived
            data_type: boolean
          - name: origin
            data_type: varchar
          - name: origin_id
            data_type: varchar
          - name: channel
            data_type: bigint
          - name: channel_id
            data_type: varchar
          - name: arr
            data_type: double
          - name: mrr
            data_type: double
          - name: acv
            data_type: double
          - name: expected_close_date
            data_type: date
          - name: add_time
            data_type: timestamp with time zone
          - name: update_time
            data_type: timestamp with time zone
          - name: stage_change_time
            data_type: timestamp with time zone
          - name: close_time
            data_type: timestamp with time zone
          - name: won_time
            data_type: timestamp with time zone
          - name: lost_time
            data_type: timestamp with time zone
          - name: custom_fields
            data_type: varchar
          - name: _load_id
            data_type: varchar
          - name: _raw_load_id
            data_type: varchar
          - name: _loaded_at
            data_type: timestamp with time zone
          - name: _source_updated_at
            data_type: timestamp with time zone
          - name: _is_deleted
            data_type: boolean
      - name: persons
        description: "Persons (contacts). Incremental, upserted on id."
        columns:
          - name: id
            data_type: bigint
          - name: name
            data_type: varchar
          - name: first_name
            data_type: varchar
          - name: last_name
            data_type: varchar
          - name: owner_id
            data_type: bigint
          - name: org_id
            data_type: bigint
          - name: emails
            data_type: varchar
          - name: phones
            data_type: varchar
          - name: visible_to
            data_type: bigint
          - name: label_ids
            data_type: varchar
          - name: picture_id
            data_type: bigint
          - name: postal_address
            data_type: varchar
          - name: notes
            data_type: varchar
          - name: im
            data_type: varchar
          - name: birthday
            data_type: varchar
          - name: job_title
            data_type: varchar
          - name: is_deleted
            data_type: boolean
          - name: add_time
            data_type: timestamp with time zone
          - name: update_time
            data_type: timestamp with time zone
          - name: custom_fields
            data_type: varchar
          - name: _load_id
            data_type: varchar
          - name: _raw_load_id
            data_type: varchar
          - name: _loaded_at
            data_type: timestamp with time zone
          - name: _source_updated_at
            data_type: timestamp with time zone
          - name: _is_deleted
            data_type: boolean
      - name: organizations
        description: "Organizations (accounts). Incremental, upserted on id."
        columns:
          - name: id
            data_type: bigint
          - name: name
            data_type: varchar
          - name: owner_id
            data_type: bigint
          - name: visible_to
            data_type: bigint
          - name: address
            data_type: varchar
          - name: label_ids
            data_type: varchar
          - name: website
            data_type: varchar
          - name: linkedin
            data_type: varchar
          - name: industry
            data_type: bigint
          - name: annual_revenue
            data_type: bigint
          - name: employee_count
            data_type: bigint
          - name: is_deleted
            data_type: boolean
          - name: add_time
            data_type: timestamp with time zone
          - name: update_time
            data_type: timestamp with time zone
          - name: custom_fields
            data_type: varchar
          - name: _load_id
            data_type: varchar
          - name: _raw_load_id
            data_type: varchar
          - name: _loaded_at
            data_type: timestamp with time zone
          - name: _source_updated_at
            data_type: timestamp with time zone
          - name: _is_deleted
