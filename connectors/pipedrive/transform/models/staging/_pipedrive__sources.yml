          - name: project_id
            data_type: bigint
          - name: due_date
            data_type: date
          - name: due_time
            data_type: varchar
          - name: duration
            data_type: varchar
          - name: busy
            data_type: boolean
          - name: done
            data_type: boolean
          - name: marked_as_done_time
            data_type: timestamp with time zone
          - name: location
            data_type: varchar
          - name: participants
            data_type: varchar
          - name: attendees
            data_type: varchar
          - name: conference_meeting_client
            data_type: varchar
          - name: conference_meeting_url
            data_type: varchar
          - name: conference_meeting_id
            data_type: varchar
          - name: public_description
            data_type: varchar
          - name: priority
            data_type: bigint
          - name: outcome
            data_type: bigint
          - name: note
            data_type: varchar
          - name: is_deleted
            data_type: boolean
          - name: add_time
            data_type: timestamp with time zone
          - name: update_time
            data_type: timestamp with time zone
          - name: _load_id
            data_type: varchar
          - name: _raw_load_id
            data_type: varchar
          - name: _loaded_at
            data_type: timestamp with time zone
          - name: _source_updated_at
            data_type: timestamp with time zone
          - name: _is_deleted
            data_type: boolean
      - name: pipelines
        description: "Sales pipelines. Full refresh, replaced on every load."
        columns:
          - name: id
            data_type: bigint
          - name: name
