            data_type: varchar
          - name: _load_id
            data_type: varchar
          - name: _raw_load_id
            data_type: varchar
          - name: _loaded_at
            data_type: timestamp with time zone
          - name: _source_updated_at
            data_type: timestamp with time zone
      - name: person_fields
        description: "Person field definitions, used to decode person custom fields. Full refresh, replaced on every load."
        columns:
          - name: field_code
            data_type: varchar
          - name: field_name
            data_type: varchar
          - name: field_type
            data_type: varchar
          - name: options
